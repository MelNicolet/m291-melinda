<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2F5A3A">
<title>Ritmo — Chanson</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/app.js" defer></script>
</head>
<body data-page="chanson">
<a class="skip" href="#contenu">Aller au contenu</a>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-maison" viewBox="0 0 24 24"><path d="M3 11.5 12 3l9 8.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-compte" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.2"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></symbol>
  <symbol id="i-prec" viewBox="0 0 24 24"><path d="M5 5h2.4v14H5zM20 5v14L8.6 12z"/></symbol>
  <symbol id="i-suiv" viewBox="0 0 24 24"><path d="M16.6 5H19v14h-2.4zM4 5l11.4 7L4 19z"/></symbol>
  <symbol id="i-lire" viewBox="0 0 24 24"><path d="M8 4.5v15l12-7.5z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 4.5h4v15H6zM14 4.5h4v15h-4z"/></symbol>
  <symbol id="i-etoile" viewBox="0 0 24 24"><path d="m12 2.5 3 6.6 7.2.7-5.4 4.8 1.6 7.1L12 18l-6.4 3.7 1.6-7.1L1.8 9.8 9 9.1z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M10.6 4h2.8v6.6H20v2.8h-6.6V20h-2.8v-6.6H4v-2.8h6.6z"/></symbol>
</svg>
<div class="app ">
  <a class="compte" href="connexion.html" aria-label="Mon compte"><svg aria-hidden="true"><use href="#i-compte"/></svg></a>
  <header class="haut">
    <h1 class="titre-chanson" id="titre">Chanson</h1>
    <p class="sous" id="artiste"></p>
  </header>
  <main id="contenu" class="corps">
    <figure class="pochette" id="pochette"></figure>
    <div class="temps" aria-hidden="true"><span id="t-cur">0:00</span><div class="prog"><span id="prog"></span></div><span id="t-tot">0:00</span></div>
    <div class="commandes commandes--lecteur">
      <button class="cmd cmd--rond cmd--etoile" id="fav" type="button" aria-pressed="false" aria-label="Ajouter aux favoris"><svg aria-hidden="true"><use href="#i-etoile"/></svg></button>
      <div class="groupe" id="ctrl">
        <button class="cmd" type="button" data-act="prev" aria-label="Morceau précédent"><svg aria-hidden="true"><use href="#i-prec"/></svg></button>
        <button class="cmd cmd--lire" type="button" data-act="play" aria-label="Lire"><svg aria-hidden="true"><use href="#i-lire"/></svg></button>
        <button class="cmd" type="button" data-act="next" aria-label="Morceau suivant"><svg aria-hidden="true"><use href="#i-suiv"/></svg></button>
      </div>
      <button class="cmd cmd--rond" id="plus" type="button" aria-label="Ajouter à ma playlist"><svg aria-hidden="true"><use href="#i-plus"/></svg></button>
    </div>
    <p class="note" id="player-status" role="status" aria-live="polite">Recherche d’un aperçu musical…</p>
    <p class="etat" id="genre"></p>
    <a class="btn btn--principal" id="spotify-link" href="https://open.spotify.com/" target="_blank" rel="noopener noreferrer">Chercher sur Spotify</a>
    <p class="sous">Les boutons lisent des extraits Apple Music (jusqu’à 30 s). Spotify ouvre une recherche et peut demander un compte.</p>
  </main>
  <nav class="pied" aria-label="Navigation"><a class="maison" href="index.html" aria-label="Retour à l’accueil"><svg aria-hidden="true"><use href="#i-maison"/></svg></a></nav>
</div>
</body>
</html>
