<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phare : les endroits calmes encore ouverts</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">

<body>
  <header>
    <h1>Phare</h1>
    <p>Les endroits calmes encore ouverts ce soir, près de chez vous.</p>
  </header>

  <main>
    <form id="form-lieu" novalidate>
      <h2>Proposer un lieu</h2>

      <label for="nom-lieu">Nom du lieu</label>
      <input id="nom-lieu" name="nom-lieu" type="text" placeholder="Ex. Jardin secret" maxlength="60">

      <label for="quartier-lieu">Quartier</label>
      <input id="quartier-lieu" name="quartier-lieu" type="text" placeholder="Ex. Centre" maxlength="40">

      <label for="bruit-lieu">Niveau de bruit</label>
      <input id="bruit-lieu" name="bruit-lieu" type="number" min="1" max="5" value="2">

      <label for="ouvert-lieu">
        <input id="ouvert-lieu" name="ouvert-lieu" type="checkbox" checked>
        Le lieu est ouvert ce soir
      </label>

      <button type="submit">Ajouter le lieu</button>
    </form>

    <p id="erreurs" aria-live="polite"></p>

    <section id="liste-cartes" aria-label="Lieux"></section>
  </main>

  <script src="lieux.js"></script>
  <script src="app.js"></script>
</body>
</html>
